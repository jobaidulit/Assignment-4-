<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Applied Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!--font awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />
</head>

<body class="bg-gray-100">

    <!--  DASHBOARD  -->
    <div class="w-[80%] mx-auto p-4">
        <h1 class="text-3xl font-bold mb-6">Job Application Tracker</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-3 rounded-xl shadow">
                <h2 class="text-gray-500">Total Jobs</h2>
                <p id="totalCount" class="text-3xl font-bold">8</p>
            </div>
            <div class="bg-white p-3 rounded-xl shadow">
                <h2 class="text-gray-500">Interview</h2>
                <p id="interviewCount" class="text-3xl font-bold text-green-600">0</p>
            </div>
            <div class="bg-white p-3 rounded-xl shadow">
                <h2 class="text-gray-500">Rejected</h2>
                <p id="rejectedCount" class="text-3xl font-bold text-red-600">0</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-4 mb-6">
            <button class="tab-btn bg-blue-600 text-white px-4 py-2 rounded" data-tab="all">All (8)</button>
            <button class="tab-btn bg-white text-black px-4 py-2 rounded" data-tab="interview">Interview (0)</button>
            <button class="tab-btn bg-white text-black px-4 py-2 rounded" data-tab="rejected">Rejected (0)</button>
        </div>

        <!-- Jobs Container -->
        <div id="jobsContainer" class="grid grid-cols-1 md:grid-cols-1 lg:grid-cols-1 gap-6"></div>

        <!-- Empty State -->

        <div id="emptyState" class="hidden flex flex-col items-center justify-center text-center py-16">

            <img src="jobs.png" alt="No Jobs" class="w-40 md:w-56 mb-6 mx-auto">

            <h3 class="text-xl font-semibold">No Jobs Available</h3>
            <p class="text-gray-500 mt-2">
                Check back soon for new job opportunities.
            </p>

        </div>

    </div>

    <!-- AVAILABLE JOBS -->
    <div class=" w-[80%] mx-auto flex justify-between px-8 mb-6">
        <h2 class="text-xl font-semibold">Available Jobs</h2>
        <span id="sectionCount" class="text-black font-medium">8 Jobs</span>
    </div>

    <script src="script.js"></script>

</body>

</html>
